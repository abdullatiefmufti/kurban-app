<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Konfirmasi Kurban</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h4 class="mb-0">Konfirmasi Pembayaran</h4>
                        <small>Admin Panel</small>
                    </div>
                    <div class="card-body p-4">
                        <form id="adminForm">
                            <div class="mb-3">
                                <label class="form-label fw-bold">ID QR / Nomor Kupon</label>
                                <input type="text" name="id_pencarian" class="form-control" placeholder="Contoh: KPN-1234 atau QR-abcd" required>
                                <div class="form-text">Masukkan kode dari data booking pekurban.</div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold">Berat Hewan (Kg)</label>
                                <input type="number" step="0.1" name="berat" class="form-control" placeholder="Contoh: 350.5" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Konfirmasi & Lunas</button>
                        </form>
                        <div id="responseMessage" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzaiaFc87YfZK3WnLyZgRpyyv3wordLa42V375zUMtgB95onQM5q3iy9mFO9FNRaOOR/exec";

        document.getElementById('adminForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());
            data.action = "confirm_payment"; // Action khusus admin

            const submitBtn = this.querySelector('button');
            submitBtn.disabled = true;
            submitBtn.innerText = "Memproses...";

            fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(res => {
                const msg = document.getElementById('responseMessage');
                if(res.status === "SUCCESS") {
                    msg.innerHTML = `<div class="alert alert-success"><strong>✅ Berhasil!</strong><br>Status Lunas. Jatah: ${res.jatah} paket. Link QR Code telah disiapkan.</div>`;
                    document.getElementById('adminForm').reset();
                } else {
                    msg.innerHTML = `<div class="alert alert-danger">⚠️ Gagal: ${res.message}</div>`;
                }
            })
            .catch(err => {
                document.getElementById('responseMessage').innerHTML = `<div class="alert alert-danger">❌ Terjadi kesalahan jaringan.</div>`;
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = "Konfirmasi & Lunas";
            });
        });
    </script>
</body>
</html>
