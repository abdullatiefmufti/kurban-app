<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Validasi Kurban</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #e9ecef; }
        .card { border-radius: 12px; border: none; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white p-3 text-center">
                        <h4 class="mb-0">Validasi & Input Berat Hewan</h4>
                    </div>
                    <div class="card-body p-4">
                        <form id="adminForm">
                            <div class="mb-3">
                                <label class="form-label fw-bold">ID QR / Nomor Kupon</label>
                                <input type="text" name="id_pencarian" class="form-control form-control-lg" placeholder="Contoh: KPN-1234" required autocomplete="off">
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold">Berat Hewan (Kg)</label>
                                <input type="number" step="0.1" name="berat" class="form-control form-control-lg" placeholder="Masukkan berat..." required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 fs-5 fw-bold" id="btnAdmin">Konfirmasi Status LUNAS</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://kurban-app-rho.vercel.app/";

        document.getElementById('adminForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(this).entries());
            data.action = "confirm_payment";

            const btn = document.getElementById('btnAdmin');
            btn.disabled = true; btn.innerText = "Menyimpan Data...";

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();

                if(result.status === "SUCCESS") {
                    Swal.fire('Lunas!', `Data tervalidasi.\nSistem menetapkan jatah pekurban: ${result.jatah} paket.`, 'success');
                    this.reset();
                } else {
                    Swal.fire('Gagal', result.message, 'warning');
                }
            } catch (err) {
                Swal.fire('Koneksi Terputus', 'Gagal menghubungi server.', 'error');
            } finally {
                btn.disabled = false; btn.innerText = "Konfirmasi Status LUNAS";
            }
        });
    </script>
</body>
</html>
