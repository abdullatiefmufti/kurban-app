<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Kurban | Masjid Al-Kautsar</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f7f6; }
        .card { border-radius: 15px; border: none; }
        .btn-success { background-color: #198754; border-radius: 8px; }
        .header-bg { background: linear-gradient(135deg, #198754, #20c997); border-radius: 15px 15px 0 0; }
    </style>
</head>
<body>
    <div class="container mt-4 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-lg">
                    <div class="header-bg text-white text-center py-4">
                        <h3 class="fw-bold mb-0">Pendaftaran Kurban</h3>
                        <p class="mb-0 text-light">Masjid Al-Kautsar</p>
                    </div>
                    <div class="card-body p-4">
                        <form id="bookingForm">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-muted">Nama Lengkap (Sesuai Niat Kurban)</label>
                                <input type="text" name="nama" class="form-control form-control-lg" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold text-muted">Nomor WhatsApp Aktif</label>
                                <input type="number" name="whatsapp" class="form-control form-control-lg" placeholder="Contoh: 62812..." required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold text-muted">Alamat Domisili</label>
                                <textarea name="alamat" class="form-control" rows="3" required></textarea>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold text-muted">Layanan Kurban</label>
                                <select name="layanan" class="form-select form-select-lg" required>
                                    <option value="" disabled selected>-- Pilih Layanan --</option>
                                    <option value="Beli + Potong">Pengadaan Hewan + Potong</option>
                                    <option value="Hanya Potong">Hanya Potong (Bawa Hewan Sendiri)</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success w-100 py-3 fw-bold fs-5 shadow-sm" id="btnSubmit">
                                Kirim Formulir Pendaftaran
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwe-ebulYcg1NwDWu2f6NKPqGcZlX4wqd64lNnLK50R5T6JfPKaJYHa8mzNvgSFxLXO/exec";

        document.getElementById('bookingForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());
            data.action = "booking_self_service";

            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm"></span> Memproses...`;

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();

                if(result.status === "SUCCESS") {
                    Swal.fire('Berhasil!', 'Data pendaftaran kurban Anda telah tersimpan. Panitia akan menghubungi via WhatsApp.', 'success');
                    this.reset();
                } else {
                    Swal.fire('Gagal', result.message, 'error');
                }
            } catch (error) {
                Swal.fire('Error', 'Terjadi kesalahan jaringan. Coba beberapa saat lagi.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `Kirim Formulir Pendaftaran`;
            }
        });
    </script>
</body>
</html>
