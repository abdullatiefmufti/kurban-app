<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Kurban Self-Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-success text-white text-center py-3">
                        <h4 class="mb-0">Form Booking Kurban</h4>
                        <small>Masjid Al-Kautsar</small>
                    </div>
                    <div class="card-body p-4">
                        <form id="bookingForm">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nama Lengkap</label>
                                <input type="text" name="nama" class="form-control" placeholder="Masukkan nama pekurban" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nomor WhatsApp</label>
                                <input type="number" name="whatsapp" class="form-control" placeholder="Contoh: 62812345678" required>
                                <div class="form-text">Gunakan awalan 628 tanpa tanda + atau 0.</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Alamat Lengkap</label>
                                <textarea name="alamat" class="form-control" rows="3" placeholder="Masukkan alamat domisili" required></textarea>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold">Jenis Layanan</label>
                                <select name="layanan" class="form-select" required>
                                    <option value="" disabled selected>Pilih layanan kurban...</option>
                                    <option value="Beli + Potong">Beli Hewan + Potong</option>
                                    <option value="Hanya Potong">Hanya Potong (Bawa Hewan Sendiri)</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Kirim Pesanan</button>
                        </form>
                        <div id="responseMessage" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // URL Web App Google Apps Script milik Anda
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzaiaFc87YfZK3WnLyZgRpyyv3wordLa42V375zUMtgB95onQM5q3iy9mFO9FNRaOOR/exec";

        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Mencegah halaman reload
            
            // Mengambil data dari form
            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());
            data.action = "booking_self_service"; // Parameter penanda untuk Apps Script

            // Mengubah tombol saat loading
            const submitBtn = this.querySelector('button');
            submitBtn.disabled = true;
            submitBtn.innerText = "Memproses Pesanan...";

            // Mengirim data ke Google Apps Script
            fetch(GAS_URL, {
                method: 'POST',
                // Trik CORS: Gunakan text/plain agar browser tidak melakukan preflight request
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8',
                },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(res => {
                const msg = document.getElementById('responseMessage');
                if(res.status === "SUCCESS") {
                    msg.innerHTML = `<div class="alert alert-success"><strong>✅ Booking Berhasil!</strong><br>Silakan tunggu konfirmasi panitia melalui WhatsApp.</div>`;
                    document.getElementById('bookingForm').reset(); // Kosongkan form setelah sukses
                } else {
                    msg.innerHTML = `<div class="alert alert-danger">⚠️ Terjadi kesalahan: ${res.message}</div>`;
                }
            })
            .catch(err => {
                console.error("Fetch error:", err);
                document.getElementById('responseMessage').innerHTML = `<div class="alert alert-danger">❌ Gagal terhubung ke server. Pastikan koneksi internet stabil.</div>`;
            })
            .finally(() => {
                // Kembalikan tombol ke kondisi semula
                submitBtn.disabled = false;
                submitBtn.innerText = "Kirim Pesanan";
            });
        });
    </script>
</body>
</html>
