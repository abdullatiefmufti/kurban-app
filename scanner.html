<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Distribusi</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #121212; color: white; }
        #reader { border: 2px solid #333; border-radius: 10px; background: black; }
        .btn-scan { background: #ffc107; color: black; font-weight: bold; border-radius: 30px; }
    </style>
</head>
<body>
    <div class="container mt-3 text-center">
        <h4 class="mb-3 text-warning">Scanner Distribusi</h4>
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div id="reader" style="width: 100%; min-height: 300px;"></div>
                <button id="resumeBtn" class="btn btn-scan w-100 py-3 mt-4 d-none" onclick="resumeScanner()">
                    Lanjut Scan Kupon Berikutnya
                </button>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzaiaFc87YfZK3WnLyZgRpyyv3wordLa42V375zUMtgB95onQM5q3iy9mFO9FNRaOOR/exec";
        let html5QrcodeScanner;

        async function onScanSuccess(decodedText) {
            html5QrcodeScanner.pause();
            Swal.fire({ title: 'Memproses...', text: decodedText, showConfirmButton: false, allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: "scan_qr", id_qr: decodedText })
                });
                const data = await res.json();

                if (data.status === "SUCCESS_PENERIMA") {
                    Swal.fire({ icon: 'success', title: 'VALID', html: `Penerima Umum: <b>${data.nama}</b><br>Berikan 1 Paket.`, confirmButtonText: 'Tutup' });
                } else if (data.status === "SUCCESS_PEKURBAN") {
                    // Custom prompt elegan untuk input jumlah cicilan
                    const { value: qty } = await Swal.fire({
                        title: 'Jatah Pekurban',
                        html: `Nama: <b>${data.nama}</b><br>Sisa Jatah: <b class='text-primary fs-3'>${data.sisa}</b> paket.<br><br>Berapa paket yang diambil saat ini?`,
                        input: 'number',
                        inputValue: 1,
                        inputAttributes: { min: 1, max: data.sisa, step: 1 },
                        showCancelButton: true,
                        confirmButtonText: 'Catat Pengambilan'
                    });
                    if (qty) processAmbilPekurban(decodedText, qty, data.nama);
                    else resumeScanner(); // Cancelled
                } else if (data.status === "ALREADY_TAKEN") {
                    Swal.fire({ icon: 'error', title: 'KUPON HANGUS', html: `Telah diambil oleh <b>${data.nama}</b> pada ${new Date(data.waktu).toLocaleString('id-ID')}`});
                } else {
                    Swal.fire('Tidak Valid', data.message || 'QR/ID tidak dikenali oleh sistem.', 'error');
                }
            } catch (e) {
                Swal.fire('Error', 'Gagal memproses data jaringan.', 'error');
            }
            document.getElementById('resumeBtn').classList.remove('d-none');
        }

        async function processAmbilPekurban(id, qty, nama) {
            Swal.fire({ title: 'Menyimpan...', showConfirmButton: false, didOpen: () => Swal.showLoading() });
            const res = await fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: "update_pekurban", id_qr: id, jumlah: qty })
            });
            const data = await res.json();
            if(data.status === "SUCCESS") {
                Swal.fire('Tersimpan!', `${nama} telah mengambil ${qty} paket.\nSisa jatah: ${data.sisa_sekarang} paket.`, 'success');
            } else {
                Swal.fire('Gagal', data.message, 'error');
            }
        }

        function resumeScanner() {
            document.getElementById('resumeBtn').classList.add('d-none');
            html5QrcodeScanner.resume();
            Swal.close();
        }

        window.onload = function() {
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
            html5QrcodeScanner.render(onScanSuccess);
        }
    </script>
</body>
</html>
