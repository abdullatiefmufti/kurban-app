<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Kurban</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-dark text-white">
    <div class="container mt-4 text-center">
        <h3 class="mb-3">Scan Kupon Kurban</h3>
        
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div id="reader" class="bg-white text-dark rounded shadow overflow-hidden" style="width: 100%; min-height: 300px;"></div>
                
                <div id="result" class="mt-4"></div>
                <button id="resumeBtn" class="btn btn-warning mt-3 w-100 d-none" onclick="resumeScanner()">Scan Kupon Berikutnya</button>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/u/0/home/projects/1CLy7NxXg1TQbYV3b7aBpVtoeiK5rrVoA_kvmCCz9EdBh4AFuCAzYHMke/edit";
        let html5QrcodeScanner;

        function onScanSuccess(decodedText, decodedResult) {
            // Hentikan scanner sementara agar tidak scan berulang kali
            html5QrcodeScanner.pause();
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `<div class="alert alert-info">Memproses kode: ${decodedText}...</div>`;

            // Kirim ID ke GAS
            fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: "scan_qr", id_qr: decodedText })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "SUCCESS_PENERIMA") {
                    resultDiv.innerHTML = `<div class="alert alert-success"><strong>✅ SUKSES (PENERIMA)</strong><br>Nama: ${data.nama}<br>Bisa ambil 1 paket.</div>`;
                } else if (data.status === "SUCCESS_PEKURBAN") {
                    // Logic prompt cicil jatah ada di sini nantinya
                    let qty = prompt(`[PEKURBAN] Nama: ${data.nama}\nSisa Jatah: ${data.sisa} paket.\n\nBerapa paket yang diambil sekarang?`, "1");
                    if(qty) { processAmbilPekurban(decodedText, qty, data.nama); }
                } else if (data.status === "ALREADY_TAKEN") {
                    resultDiv.innerHTML = `<div class="alert alert-danger"><strong>⚠️ KUPON HANGUS</strong><br>Telah ditukar oleh ${data.nama} pada ${data.waktu}.</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="alert alert-danger">❌ Data tidak ditemukan.</div>`;
                }
                document.getElementById('resumeBtn').classList.remove('d-none');
            })
            .catch(err => {
                resultDiv.innerHTML = `<div class="alert alert-danger">Gagal menghubungi server.</div>`;
                document.getElementById('resumeBtn').classList.remove('d-none');
            });
        }

        function processAmbilPekurban(id, qty, nama) {
             const resultDiv = document.getElementById('result');
             resultDiv.innerHTML = `<div class="alert alert-warning">Mencatat pengambilan pekurban...</div>`;
             
             fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: "update_pekurban", id_qr: id, jumlah: qty })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === "SUCCESS") {
                    resultDiv.innerHTML = `<div class="alert alert-success"><strong>✅ SUKSES</strong><br>${nama} mengambil ${qty} paket.<br>Sisa Jatah: ${data.sisa_sekarang}</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="alert alert-danger">⚠️ Gagal: ${data.message}</div>`;
                }
            });
        }

        function resumeScanner() {
            document.getElementById('result').innerHTML = "";
            document.getElementById('resumeBtn').classList.add('d-none');
            html5QrcodeScanner.resume();
        }

        // Inisialisasi Scanner saat halaman dimuat
        window.onload = function() {
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
            html5QrcodeScanner.render(onScanSuccess);
        }
    </script>
</body>
</html>
